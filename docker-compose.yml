version: '3.8'

services:
  moviebox-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviebox-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
